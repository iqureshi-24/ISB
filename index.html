<title>International School of Bo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: school-portal shell — crest + menu rail on the left, one working view on the right; stacks to a top bar on phones */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --sunk:#E4E9ED; --ink:#14213D; --muted:#56637A; --faint:#8A95A6; --line:#D5DCE3;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8; --brass:#B4862B; --navy:#14213D;
  --good:#1B6B40; --good-soft:#DDF2E5; --warn:#8A5A00; --warn-soft:#FBEFD5; --bad:#B8352A; --bad-soft:#FBE3E0;
  --c-maths:#2C5DA8; --c-physics:#6A47B8; --c-chemistry:#B5502A; --c-biology:#3E7F2B; --c-cs:#0F7A7A; --c-english:#A3366A; --c-business:#8A6411; --c-test:#4A5568;
  --f-display:"Zilla Slab", "Rockwell", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141E; --surface:#161F2C; --sunk:#1D2836; --ink:#E6EBF2; --muted:#A3AEBF; --faint:#6F7B8E; --line:#2A3647;
  --accent:#54C0A0; --accent-ink:#0B1A15; --accent-soft:#163A31; --brass:#D9AE5A; --navy:#14213D;
  --good:#5CCB8B; --good-soft:#163527; --warn:#E8B64C; --warn-soft:#3A2E12; --bad:#F07F72; --bad-soft:#3E1D1A;
  --c-maths:#7FA8EE; --c-physics:#A98BEB; --c-chemistry:#EE9472; --c-biology:#8FCB72; --c-cs:#5CC9C6; --c-english:#E58BB4; --c-business:#D9B25C; --c-test:#A3AEBF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141E; --surface:#161F2C; --sunk:#1D2836; --ink:#E6EBF2; --muted:#A3AEBF; --faint:#6F7B8E; --line:#2A3647;
  --accent:#54C0A0; --accent-ink:#0B1A15; --accent-soft:#163A31; --brass:#D9AE5A; --navy:#14213D;
  --good:#5CCB8B; --good-soft:#163527; --warn:#E8B64C; --warn-soft:#3A2E12; --bad:#F07F72; --bad-soft:#3E1D1A;
  --c-maths:#7FA8EE; --c-physics:#A98BEB; --c-chemistry:#EE9472; --c-biology:#8FCB72; --c-cs:#5CC9C6; --c-english:#E58BB4; --c-business:#D9B25C; --c-test:#A3AEBF;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
::selection{background:var(--accent-soft);color:var(--ink)}
html{scrollbar-color:var(--faint) var(--bg);accent-color:var(--accent);caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.85rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.meta{color:var(--muted);font-size:.95rem;margin-top:4px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:44px;height:auto;flex:none}
.brand b{font-family:var(--f-display);font-size:1.4rem;letter-spacing:.06em;display:block;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:3px}
nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:.97rem;transition:background-color 160ms ease-out,color 160ms ease-out}
.nav.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.sublist{display:flex;flex-direction:column;gap:1px;padding-left:22px}
.sublist .nav{min-height:44px;font-size:.92rem}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chev{margin-left:auto;transition:transform 200ms ease-out;display:flex}
.open .chev{transform:rotate(180deg)}
.sync{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);padding:0 8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--good)} .sync.off i{background:var(--warn)}
.theme{margin-top:auto;display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:9px}
.theme button{flex:1;border:0;background:none;min-height:44px;border-radius:6px;font-size:.82rem;color:var(--muted)}
.theme button.on{background:var(--surface);color:var(--ink);font-weight:700}
.topbar{display:none}
main{min-width:0;padding-block:30px 64px;padding-left:max(32px, env(safe-area-inset-left, 0px));padding-right:max(32px, env(safe-area-inset-right, 0px));max-width:1200px;width:100%}
.view{display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel>h2{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;border-radius:4px;transition:width 300ms ease-out}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-none{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:9px;font-weight:700;font-size:.92rem;transition:transform 160ms ease-out,border-color 160ms ease-out,background-color 160ms ease-out}
.btn:active,.seg button:active,.cell:active,.nav:active,.links a:active,.daypills button:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.linkbtn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.93rem}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:.94rem}
.alert:first-child{border-top:0}
.alert svg{width:18px;height:18px;flex:none;margin-top:3px}
/* now card */
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.now .subj{font-weight:700;color:var(--sc)}
.now h2{font-size:1.55rem;margin:2px 0 4px}
.now .left{font-family:var(--f-mono);font-size:2.4rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.now .left small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400;margin-top:6px}
.pips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pips span{height:8px;width:38px;border-radius:4px;background:var(--sunk)}
.pips span.d{background:var(--good)} .pips span.n{background:var(--sc)}
/* timetable */
.tt-wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:50px repeat(4,minmax(100px,1fr)) 18px repeat(2,minmax(100px,1fr));gap:6px;min-width:740px}
.tt .h{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:center;padding-bottom:2px}
.tt .d{font-family:var(--f-display);font-weight:600;display:flex;flex-direction:column;justify-content:center;font-size:1rem;line-height:1.1}
.tt .d small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400}
.tt .d.today{color:var(--accent)}
.gap{background:var(--sunk);border-radius:6px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.68rem;color:var(--muted);display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.cell{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--sc) 28%,var(--line));background:color-mix(in srgb,var(--sc) 8%,var(--surface));border-radius:9px;padding:9px 10px;min-height:82px;display:flex;flex-direction:column;gap:2px;transition:transform 160ms ease-out,border-color 160ms ease-out,box-shadow 160ms ease-out}
.cell.sel{box-shadow:0 0 0 2px var(--sc)}
.cell.isnow{box-shadow:0 0 0 2px var(--accent)}
.cell .s{font-size:.74rem;font-weight:700;color:var(--sc);letter-spacing:.02em}
.cell .t{font-size:.88rem;line-height:1.3;padding-right:16px}
.cell .ok{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--good);color:var(--surface);display:none;align-items:center;justify-content:center}
.cell.done{background:var(--sunk);border-color:var(--line)}
.cell.done .t{color:var(--muted)}
.cell.done .ok{display:flex}
.cell .tag{font-size:.7rem;color:var(--muted);margin-top:auto}
.daypills{display:none;gap:6px;overflow-x:auto;padding-bottom:4px;min-width:0}
.daypills button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;font-size:.88rem;white-space:nowrap}
.daypills button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.daylist{display:none;flex-direction:column;gap:10px}
.daylist .cell{min-height:0;width:100%}
.daylist .when{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-bottom:4px}
/* detail */
.detail{display:flex;flex-direction:column;gap:16px}
.detail .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.timer{display:flex;align-items:center;gap:12px}
.timer .clock{font-size:1.7rem}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px solid transparent;transition:border-color 160ms ease-out,background-color 160ms ease-out}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}
.step label{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer}
.step input{width:24px;height:24px;flex:none}
.stepnote{margin:0 0 0 36px;color:var(--muted);font-size:.9rem;line-height:1.45}
.step .links{margin-left:36px}
.viewonly{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.94rem;line-height:1.5}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 14px;font-weight:700;font-size:.9rem;transition:transform 160ms ease-out}
.seg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:6px 12px;text-decoration:none;color:var(--ink);font-size:.9rem;background:var(--surface);transition:transform 160ms ease-out,border-color 160ms ease-out}
.links a svg{width:14px;height:14px;color:var(--muted)}
.prove{background:var(--accent-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);resize:vertical;line-height:1.5}
input[type=number],input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);width:96px}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:.94rem;white-space:pre-wrap;max-width:62ch;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end}
.msg .who{display:block;font-size:.75rem;font-weight:700;color:var(--accent);margin-bottom:2px}
.err{color:var(--bad);font-size:.86rem}
/* tests */
.test{display:flex;flex-direction:column;gap:14px}
.test .subj{font-weight:700;color:var(--sc)}
.clock{font-family:var(--f-mono);font-size:2.2rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.clock.over,.left.over{color:var(--bad)}
.clock.brk{color:var(--accent)}
.review{display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:12px;border:1px solid var(--line);transition:border-color 160ms ease-out,background-color 160ms ease-out}
.review.cur{border-color:var(--accent);background:var(--accent-soft)}
.review h3{margin:0}
.midnote{padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);font-weight:700}
.howto{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px;font-size:.94rem}
.blockhead{font-family:var(--f-display);font-size:1.05rem;font-weight:600;margin-top:8px}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:9px;font-size:.92rem}
.fallback{font-size:.88rem;color:var(--ink);background:var(--warn-soft);padding:10px 12px;border-radius:9px}
.chk{display:flex;flex-direction:column}
.chk .row{font-size:.94rem}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quad div{border-radius:9px;padding:12px;font-size:.88rem;background:var(--sunk)}
.quad b{display:block;font-size:1.4rem;font-family:var(--f-display)}
.daybars{display:flex;gap:10px;align-items:flex-end;height:120px}
.daybars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.daybars .c i{width:100%;max-width:46px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.daybars .c span{font-size:.74rem;color:var(--muted);font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,8px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;transition:opacity 180ms ease-out,transform 180ms ease-out;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media (hover:hover) and (pointer:fine){
  .nav:hover{background:var(--sunk);color:var(--ink)}
  .nav.on:hover{background:var(--accent-soft)}
  .btn:hover{border-color:var(--faint)}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
  .cell:hover{border-color:var(--sc)}
  .links a:hover{border-color:var(--accent)}
}
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(290px,85vw);z-index:40;transform:translateX(-102%);transition:transform 220ms ease-out;height:100%;padding-top:calc(20px + env(safe-area-inset-top, 0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;z-index:35;background:rgba(10,15,25,.35)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:31;background:var(--surface)}
  .topbar .brand svg{width:32px}
  .topbar .brand b{font-size:1.15rem}
  .menu{margin-left:auto}
  main{padding-block:22px 64px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .tt-wrap{display:none}
  .daypills,.daylist{display:flex}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  h1{font-size:1.5rem}
  .topbar .sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .now{grid-template-columns:minmax(0,1fr);padding:16px}
  .now .left{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition-property:opacity,color,background-color,border-color!important}.btn:active,.seg button:active,.cell:active,.nav:active,.links a:active,.daypills button:active{transform:none}}
a.btn{text-decoration:none}
</style>

<header class="topbar">
  <div class="brand"><svg role="img" aria-label="ISB crest"><use href="#crest"/></svg><div><b>ISB</b></div></div>
  <span class="sync" data-sync><i></i><span>Connecting…</span></span>

</header>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand"><svg role="img" aria-label="ISB crest"><use href="#crest"/></svg><div><b>ISB</b><small>International School of Bo</small></div></div>

    <span class="sync" data-sync><i></i><span>Connecting…</span></span>

      <button data-th="auto">Auto</button><button data-th="light">Light</button><button data-th="dark">Dark</button>
    </div>
  </aside>
  <main id="main"><p class="muted" style="margin:0">Loading ISB…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
window.addEventListener('error',function(e){var m=document.getElementById('main');if(m&&!m.querySelector('.panel,.view')){m.innerHTML='<div style="background:#FBE3E0;color:#14213D;border-radius:10px;padding:14px;font:15px/1.5 system-ui"><b>ISB couldn\'t start.</b> Send Ishaaq a screenshot of this message: '+String(e.message||'unknown error').replace(/[<>&]/g,'')+'</div>'}});
</script>
<script>

function prevLesson(s,d,i){for(let dd=d;dd>=0;dd--){const day=WEEK.days[dd];for(let ii=(dd===d?i-1:day.length-1);ii>=0;ii--){const b=day[ii];if(b.s===s&&b.type==='learn')return {b,d:dd}}}return null}
function warmText(b,d,i){const p=prevLesson(b.s,d,i);return p?`From memory, write down 3 things from ${WEEK.names[p.d]}'s ${sname(b.s)} lesson: ${p.b.t}. Then check.`:`From memory, write down 3 things from your last ${sname(b.s)} lesson at school. Then check your notes.`}
/* ---------- the school day: 7:30 to 3:30, lessons in order, timed from when Eesa actually starts ---------- */
const DAYSTART=7*60+30,DAYEND=15*60+30,MS=60000;
const DUR={maths:50,chemistry:60,biology:60,physics:40,cs:40,english:40,business:40};
const REVIEW=5,GAP=10,DHUHR=45,DHUHR_AFTER=3;
function lessonDur(d,i){const b=blockInfo(d,i);if(b.type==='test')return b.tests.reduce((a,s)=>a+TESTS[s].mins,0);return DUR[b.s]||40}
const midBreak=dur=>dur>=60?5:3;
const halfAt=dur=>Math.round(dur/2);
const gapAfter=i=>i===DHUHR_AFTER?DHUHR:GAP;
const ACTIVE=['work','mid','over','review','test'];
/* lesson timer lives on the lesson's record so every device sees the same clock; local copy only when nothing is saved yet */
const BT={};
function bTimer(d,i){const st=S.blocks[bkey(d,i)];if(st&&st.started!==undefined)return st.started?{start:st.started,ended:st.ended||null,reviewed:st.reviewed||null}:null;const k=bkey(d,i);if(k in BT)return BT[k];try{return JSON.parse(localStorage.getItem('isb_b_'+k)||'null')}catch(e){return null}}
function setBTimer(d,i,v,extra={}){const k=bkey(d,i);BT[k]=v||null;try{if(v)localStorage.setItem('isb_b_'+k,JSON.stringify(v));else localStorage.removeItem('isb_b_'+k)}catch(e){}return saveBlock(d,i,{started:v?v.start:null,ended:v&&v.ended||null,reviewed:v&&v.reviewed||null,...extra})}
/* a test lesson's clock comes from its test timers */
function lessonTimer(d,i){
  const b=WEEK.days[d][i];if(b.type!=='test')return bTimer(d,i);
  const vs=b.tests.map(s=>{const v=timerState(s);if(!v||!v.start)return null;const full=v.start+TESTS[s].mins*MS;return {start:v.start,ended:v.ended||(Date.now()>=full?full:null)}});
  const on=vs.filter(Boolean);if(!on.length)return null;
  const ended=vs.every(v=>v&&v.ended)?Math.max(...vs.map(v=>v.ended)):null;
  return {start:Math.min(...on.map(v=>v.start)),ended,reviewed:ended};
}
function phaseOf(d,i,now=Date.now()){
  const t=lessonTimer(d,i),dur=lessonDur(d,i),b=WEEK.days[d][i],o={i,dur};
  if(!t||!t.start)return {...o,p:isDone(d,i)?'done':'idle'};
  o.start=t.start;
  if(b.type==='test'){if(!t.ended)return {...o,p:'test'};return {...o,p:'after',ended:t.ended,reviewed:t.ended,until:t.ended+gapAfter(i)*MS}}
  const H=halfAt(dur),mb=midBreak(dur),el=(now-t.start)/MS;
  if(!t.ended){if(el<H)return {...o,p:'work',until:t.start+H*MS};if(el<H+mb)return {...o,p:'mid',until:t.start+(H+mb)*MS};return {...o,p:el<dur?'work':'over',until:t.start+dur*MS}}
  if(!t.reviewed)return {...o,p:'review',ended:t.ended,until:t.ended+REVIEW*MS};
  return {...o,p:'after',ended:t.ended,reviewed:t.reviewed,until:t.reviewed+gapAfter(i)*MS};
}
/* minutes of actual learning so far (the mid-lesson break doesn't count) */
function learnMin(dur,el){const H=halfAt(dur),mb=midBreak(dur);return el<H?el:el<H+mb?H:el-mb}
/* today's flow: which lesson is on, which is next, and estimated times from right now */
function dayFlow(ti,now=Date.now()){
  const day=WEEK.days[ti],ph=day.map((x,i)=>phaseOf(ti,i,now));
  const cur=ph.findIndex(p=>ACTIVE.includes(p.p));
  const fin=i=>ph[i].p==='after'||ph[i].p==='done'||(isDone(ti,i)&&ph[i].p==='idle');
  const next=day.findIndex((x,i)=>i!==cur&&!fin(i));
  let cursor=atMin(DAYSTART),finish=null;const est=[];
  day.forEach((x,i)=>{const p=ph[i],rv=x.type==='test'?0:REVIEW;let s,e;
    if(p.p==='after'){s=p.start;e=p.reviewed;cursor=Math.max(cursor,p.until)}
    else if(p.p==='done'||fin(i)){est.push(null);return}
    else if(ACTIVE.includes(p.p)){s=p.start;e=p.p==='review'?Math.max(p.until,now):p.p==='test'?Math.max(s+p.dur*MS,now):Math.max(s+p.dur*MS,now)+rv*MS;cursor=e+gapAfter(i)*MS}
    else{s=Math.max(cursor,now);e=s+(p.dur+rv)*MS;cursor=e+gapAfter(i)*MS}
    est.push({s,e,actual:p.p!=='idle'});finish=Math.max(finish||0,e)});
  const last=ph.filter(p=>p.p==='after').sort((a,b)=>b.reviewed-a.reviewed)[0]||null;
  return {ph,cur,next,est,finish,last};
}
function flowKey(){const ti=todayIdx();if(ti<0)return 'x'+new Date().getDate();const F=dayFlow(ti),now=Date.now();return ti+'|'+F.ph.map(p=>p.p).join(',')+'|'+(F.last&&now<F.last.until?1:0)+'|'+(now<atMin(DAYSTART)?1:0)}
function phaseAt(steps,min){let acc=0;for(let k=0;k<steps.length;k++){acc+=steps[k].min;if(min<acc)return k}return steps.length-1}
const fmtSigned=sec=>sec>=0?fmt(sec):'+'+fmt(-sec);
/* the big lesson clock: text, caption and a key that changes when the phase does */
function lessonClock(d,i,now=Date.now()){
  const p=phaseOf(d,i,now),sec=ms=>Math.max(0,Math.round(ms/1000));
  if(p.p==='work')return {k:'work'+(now<p.start+halfAt(p.dur)*MS?1:2),txt:fmt(sec(p.start+p.dur*MS-now)),cap:'left in this lesson'};
  if(p.p==='mid')return {k:'mid',txt:fmt(sec(p.until-now)),cap:`${midBreak(p.dur)}-min break: stand up, drink water`,cls:'brk'};
  if(p.p==='over')return {k:'over',txt:'+'+fmt(sec(now-p.until)),cap:'over time: end the lesson',cls:'over'};
  if(p.p==='review')return {k:'review',txt:fmtSigned(Math.round((p.until-now)/1000)),cap:'5-minute review',cls:now>p.until?'over':''};
  if(p.p==='after'){const took=Math.max(1,Math.round((p.ended-p.start)/MS));return now<p.until?{k:'after1',txt:fmt(sec(p.until-now)),cap:`${p.i===DHUHR_AFTER?'Dhuhr and lunch':'break'} · lesson took ${took} min`,cls:'brk'}:{k:'after2',txt:`${took} min`,cap:'lesson finished'}}
  return {k:'idle',txt:fmt(p.dur*60),cap:`${p.dur} min lesson`};
}

function proveBrief(b){

matchMedia('(max-width:1100px)').addEventListener('change',()=>{setMenu(false);syncRail()});

/* live clocks: one tick updates text only; a full render only when the block, the day or a lock changes */
let lastFlow=flowKey();
function tick(){
  document.querySelectorAll('[data-until]').forEach(el=>{const ms=+el.dataset.until-Date.now();const min=Math.max(0,Math.ceil(ms/60000));el.firstChild.nodeValue=min>=60?`${Math.floor(min/60)}h ${min%60}m`:`${min} min`});
  document.querySelectorAll('[data-since]').forEach(el=>{const min=Math.max(0,Math.floor((Date.now()-el.dataset.since)/60000));el.firstChild.nodeValue=`+${min} min`});
  let flip=false;
  document.querySelectorAll('[data-bclock]').forEach(el=>{const [d,i]=el.dataset.bclock.split('_').map(Number);const C=lessonClock(d,i);if(C.k!==el.dataset.k){flip=true;return}el.textContent=C.txt;el.className='clock mono '+(C.cls||'');const cap=el.parentNode.querySelector('[data-bcap]');if(cap)cap.textContent=C.cap;const P=phaseOf(d,i);if(P.p==='work'||P.p==='over'){const ph=phaseAt(stepsFor(blockInfo(d,i),d,i),learnMin(P.dur,(Date.now()-P.start)/MS));document.querySelectorAll('.step').forEach(l=>l.classList.toggle('cur',+l.dataset.phase===ph))}});
  document.querySelectorAll('[data-clock]').forEach(el=>{const s=el.dataset.clock,rem=remaining(s);if(rem==null)return;el.textContent=fmt(rem);if(rem===0&&!el.classList.contains('over'))flip=true});
  document.querySelectorAll('[data-lock]').forEach(el=>{if(msUnlocked(el.dataset.lock))flip=true});
  return flip;
}
setInterval(()=>{const fk=flowKey();if(fk!==lastFlow){lastFlow=fk;if(S.route==='dashboard'||S.route==='week'){liveRender();return}}if(tick())liveRender()},1000);

applyTheme(getTheme());

const h0=(location.hash||'').slice(1);if(validRoute(h0))S.route=h0;
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(validRoute(h)&&h!==S.route){S.route=h;S.sel=null;setMenu(false);render();window.scrollTo(0,0)}});
setSync('wait');
render();

const SEED={"blocks": {"2026-10-26_0_0": {"at": "2026-10-27T08:09:33.680Z", "conf": 4, "day": 0, "done": true, "idx": 0, "mins": 58, "steps": [true, true, true], "subject": "maths", "time": "on", "week": "2026-10-26"}, "2026-10-26_0_1": {"at": "2026-10-27T11:37:01.401Z", "conf": 5, "conv": [{"content": "in this lesson I learnt how to calculate percentage you and the way to do that is first they give you an equation and then you have to calculate the moles in the first element or compound which depend depending on the equation Will equal the amount of moles in another element or compound then after getting those more values you should calculate the So after you get the moles then you calculate the mass of the second element or compound and you calculate the mass by timing or multiplying the by the relative formula mass and to calculate the percentage yield they\u2019ll give you an example of a scientist who did the experiment and it will show you how much of the product the scientist sensitive and based on the calculation of the mass calculated that will be the maximum theoretical mass and then you put it in the percentage yield formula which is actual mass of product made over maximum theoretical mass of product and times it by 100 or multiplied by 100 and then you\u2019ll get the answer and you put it in a percentage form", "role": "user"}, {"content": "Good work: your formula, actual mass over maximum theoretical mass times 100, is exactly right, and you know the calculated mass is the theoretical one.\n\nGaps compared with a mark scheme:\n\n1. Moles of the first substance: you didn't say how to find them. The keyword step is moles = mass \u00f7 relative formula mass (Mr). You also said \"multiply by Mr\" for mass, which is right, but say it as mass = moles \u00d7 Mr.\n\n2. Using the equation: the key word is \"mole ratio\" (or \"molar ratio\"). The balancing numbers tell you how many moles of product form from the moles of reactant. Like a recipe: 2 slices of bread make 1 sandwich, so 10 slices make 5 sandwiches. Say \"use the ratio\", not \"will equal\", because the moles are not always equal.\n\n3. \"Actual yield\": say \"actual yield\" for what the scientist really got, and \"theoretical yield\" for the maximum.\n\n4. Units: give the answer as a % (never above 100%), and keep masses in the same unit, such as grams.\n\nCheck question: in the equation 2Mg + O\u2082 \u2192 2MgO, if you have 0.5 mol of Mg, how many moles of MgO could you make at most, and why?", "role": "assistant"}, {"content": "i got it now it\u2019s ok", "role": "user"}, {"content": "Glad it's clicking, Eesa, but \"I got it\" is exactly what I'd like to see you prove. You haven't answered the check question yet, and that's where the real learning happens.\n\nTry it now: in 2Mg + O\u2082 \u2192 2MgO, if you start with 0.5 mol of Mg, how many moles of MgO could you make at most? Tell me which numbers in the equation you used and why. Use the words \"mole ratio\" in your answer.\n\nIf you get that, the next step is a full one: a scientist makes 4.0 g of MgO, but the maximum theoretical yield was 5.0 g. What's the percentage yield? Have a go, and show me your working step by step, even if you're unsure. A wrong attempt is more useful to me than \"I got it\", because I can see where to help.", "role": "assistant"}], "day": 0, "done": true, "idx": 1, "mins": 53, "proved": true, "steps": [true, true, true], "subject": "chemistry", "time": "over", "week": "2026-10-26"}, "2026-10-26_0_2": {"at": "2026-10-27T15:07:49.242Z", "conf": 4, "conv": [{"content": "listen bru , im so tired, just tell me the least u wanna know so we can get this over with", "role": "user"}, {"content": "Fair enough, mate, I'll keep it tight. But you haven't taught me anything yet, so I can't spot gaps. Let's fix that in one go.\n\nWhat you got right: you showed up tired and still want to finish, and that's the right attitude.\n\nGap: no content yet. For spec 2.80, the mark scheme wants the key chain: a change in the environment is a stimulus, which is detected by a receptor, and the organism then makes a response. Keep stimulus, receptor and response as exact words, because \"reaction\" and \"sensor\" won't get marks.\n\nEveryday example: a hot pan touches your hand. The heat is the stimulus, the temperature receptors in your skin detect it, and your muscles pull your hand away. That's the response.\n\nAlso remember that organisms respond to stay alive, for example to find food, avoid danger or find mates.\n\nCheck question: a plant on a windowsill grows towards the light. Name the stimulus and the response, using the exact keywords.", "role": "assistant"}, {"content": "im asking you to tell me what u wanna know", "role": "user"}, {"content": "Fair, you want the target, so here it is. Keep it to three things.\n\nWhat you got right: you asked what's needed, which is smart when you're tired.\n\nWhat the mark scheme wants for 2.80:\n1. The chain: stimulus (a change in the environment), receptor (detects it), response (what the organism does).\n2. Why: responding helps survival, e.g. finding food or avoiding danger.\n3. Use these exact words. \"Reaction\" and \"sensor\" lose marks.\n\nEveryday example: your phone buzzes (stimulus), your eyes and ears detect it (receptors), you pick it up (response).\n\nNow say it back in your own words, one sentence, then we're done.\n\nCheck question: a plant on a windowsill grows towards the light. What is the stimulus, and what is the response?", "role": "assistant"}, {"content": "bro just cut to the case, ask me the question and make it clear, I don't know what ur asking right now", "role": "user"}, {"content": "Got it, here's just the question.\n\nA plant on a windowsill bends towards the window.\n\nQuestion: what is the stimulus?\n\nOne word or short phrase is fine. We'll do the response after.", "role": "assistant"}, {"content": "the stimulus is the change in environment, so in this case, its the light affecting the plant. and the response is the resulting action, which in this case, is the plant growing and bending towards the light .", "role": "user"}, {"content": "Good work: you got the stimulus (light) and the response (growing towards it) both right, and you explained them as a change and a resulting action.\n\nGaps, compared with what the mark scheme credits:\n1. Keyword \"receptor\" is missing. The chain needs stimulus, then receptor, then response, and a question on this often asks for all three.\n2. Say \"growing towards light\" as a response, and name it as a plant's response. (At IGCSE you'll later call this phototropism, but you only need the idea for now.)\n3. Missing the \"why\": responding helps survival.\n\nEveryday example: when you walk from a dark room into sunshine, your eyes are the receptors that detect the bright light (stimulus), and your pupils shrink (response). That protects your eyes, which is the survival reason.\n\nCheck question: why does a plant benefit from growing towards light? Answer in one short sentence.", "role": "assistant"}, {"content": "wait, so tell me why would've been a better answer", "role": "user"}, {"content": "Good news: your stimulus and response were right, so you're only missing the last link.\n\nGap: the \"why\". A better answer ends with a \"because\" that links the response to survival, using exact keywords.\n\nHere's the pattern with a different example: \"The hand pulls away from the hot pan (response) because this avoids damage to the body (survival).\"\n\nEveryday example: you're low on phone battery, so you move to sit near a socket. Moving is the response, and the benefit is getting the energy you need.\n\nNow do the same for the plant. Light is the plant's energy source, a bit like that socket. I won't give you the finished sentence, but one process is the key word the mark scheme wants.\n\nCheck question: what process do plants use light for? One word is fine.", "role": "assistant"}, {"content": "so give me the ideal answer that would've been perfect", "role": "user"}, {"content": "Here's the model answer for your plant explanation, with one word left blank because that's my check question.\n\nWhat you got right: your stimulus (light) and response (growing towards it) were both correct.\n\nIdeal answer: \"The stimulus is light, a change in the environment. Receptors in the shoot tip detect it. The response is the shoot growing towards the light. This helps the plant survive because it gets more light for ________, which makes the food (glucose) it needs to grow.\"\n\nGaps that answer fixes:\n1. \"Receptors\" named in the chain.\n2. A \"because\" linking the response to survival.\n\nEveryday example: it's like turning your face to a heater when you're cold. You detect the cold, you move, and you get the warmth you need.\n\nCheck question: what one word goes in the blank?", "role": "assistant"}], "day": 0, "done": true, "idx": 2, "mins": 178, "proved": true, "steps": [true, true, true, true], "subject": "biology", "time": "over", "week": "2026-10-26"}, "2026-10-26_0_3": {"at": "2026-10-27T15:41:07.904Z", "conf": 4, "conv": [{"content": "I learned that specific heat capacity of a substance is the amount of energy required to raise the temperature of 1kg of the substance by 1 degree celsius. I also learnt the formula for this, which is  : delta thermal energy = mass x specific heat capacity x temperature change, and I solved questions using this formula.", "role": "user"}, {"content": "Nice one, Eesa: your definition has the key ideas, energy, 1 kg and 1 \u00b0C, and you know the equation links them.\n\nGaps compared with an Edexcel mark scheme:\n\n1. Unit: you haven't given the unit, J/kg \u00b0C (joules per kilogram per degree Celsius). Marks are often lost here.\n2. Keyword: the standard wording is \"change in thermal energy\", and the symbols are \u0394Q = m \u00d7 c \u00d7 \u0394\u03b8. Say \"change in thermal energy\" in full.\n3. Meaning: \"specific\" means per 1 kg, and \"heat capacity\" is how much energy a material soaks up. Water's value is about 4200 J/kg \u00b0C, so it takes a lot of energy to warm up. That's why a cup of tea stays hot for ages while a metal spoon in it heats up quickly. The spoon has a low specific heat capacity.\n4. Be careful with \"amount of energy required\". Write \"energy needed to raise the temperature of 1 kg by 1 \u00b0C\" and make sure you say the energy is transferred to the substance.\n\nCheck question: Two 1 kg blocks, one copper (c = 390 J/kg \u00b0C) and one aluminium (c = 900 J/kg \u00b0C), each receive the same energy. Which one gets hotter, and why?", "role": "assistant"}, {"content": "would u say I know the topic well now?", "role": "user"}, {"content": "Not quite yet, but you're close. Your definition and equation are solid, and that's the hard core of the topic.\n\nGaps still open:\n\n1. Unit: you haven't yet stated J/kg \u00b0C. Examiners want it, and you need it for calculations too.\n2. Meaning of the number: you haven't shown you can say what a high or low specific heat capacity does. A low value means a small amount of energy changes the temperature a lot, like a metal spoon in hot tea heating up fast. A high value means the substance needs lots of energy for the same rise, like water in a kettle taking ages to warm.\n3. My check question is still unanswered, so I can't tell if you can apply the idea, not just recite it.\n\nAlso watch for questions giving grams or kJ. Convert to kg and J before using \u0394Q = m \u00d7 c \u00d7 \u0394\u03b8.\n\nCheck question: copper (390 J/kg \u00b0C) and aluminium (900 J/kg \u00b0C), both 1 kg, get the same energy. Which gets hotter, and why?", "role": "assistant"}, {"content": "ok. the unit for specific heat capacity is J/kg \u00b0C.  I also learnt the meaning of the number, A low value means a small amount of energy changes the temperature a lot, like a metal spoon in hot tea heating up fast. A high value means the substance needs lots of energy for the same rise, like water in a kettle taking ages to warm. also the answer to that question is The copper block gets hotter.\nWhy: Copper has a lower specific heat capacity than aluminium, meaning it takes less energy to heat up. Given the same amount of energy, copper's temperature will rise much higher.", "role": "user"}, {"content": "Good work, Eesa: your unit is right, your copper answer is correct, and your reasoning about low specific heat capacity is spot on.\n\nGaps compared with an Edexcel mark scheme:\n\n1. Wording: \"takes less energy to heat up\" is vague. Examiners want \"less energy is needed to raise the temperature of 1 kg by 1 \u00b0C\". Always bring in the 1 kg and 1 \u00b0C.\n2. Numbers as evidence: you didn't use the values. Say \"copper 390 J/kg \u00b0C is lower than aluminium 900 J/kg \u00b0C\", so the same energy gives a bigger temperature rise. Quoting data earns marks.\n3. Equation link: rearrange \u0394Q = m \u00d7 c \u00d7 \u0394\u03b8 to \u0394\u03b8 = \u0394Q \u00f7 (m \u00d7 c). Mass and energy are the same, so a smaller c gives a bigger \u0394\u03b8. It's like two people pushing the same shove: the lighter trolley speeds up more.\n4. Remember the symbols: \u0394Q is change in thermal energy, \u0394\u03b8 is temperature change.\n\nCheck question: A 0.50 kg block of aluminium (c = 900 J/kg \u00b0C) is heated from 20 \u00b0C to 60 \u00b0C. How much energy does it gain? Show your working.", "role": "assistant"}], "day": 0, "done": true, "idx": 3, "mins": 12, "proved": true, "steps": [true, true, true], "subject": "physics", "time": "early", "week": "2026-10-26"}, "2026-10-26_1_0": {"at": "2026-10-28T09:29:28.800Z", "conf": 4, "conv": [{"content": "basically in this lesson is learn how to calculate limiting reactants and basically how you do it is that they give you a question and they give you a question like this. How many moles of zinc iodide would be produced if we use 0.5 moles of zinc and one mole of iodine .calculate the mass of the product . Basically what you have to do is write them the equation write down the moles of each one then the moles of zinc iodide will be 0.5 moles because the limiting reacting in the equation which is zinc is 0.5 moles so then we have to calculate the mass which is the mole times the relative formula mass which is 0.5\u00d7319 which is 159.5", "role": "user"}, {"content": "Nice work, Eesa. Your method is right: write the equation, compare moles, find the limiting reactant, use it to get the product, then do mass = moles \u00d7 Mr. And 0.5 \u00d7 319 = 159.5 g is correct.\n\nTwo things to tighten up for the exam.\n\nFirst, say why zinc is limiting. Zn + I\u2082 \u2192 ZnI\u2082 is a 1:1 ratio, so 0.5 mol of zinc needs only 0.5 mol of iodine. You have 1 mol, so iodine is in excess (0.5 mol left over). Zinc is the limiting reactant because it runs out first and so decides how much product forms. A mark scheme wants those words: \"limiting reactant\", \"in excess\", \"mole ratio\".\n\nSecond, include the unit. The answer is 159.5 g, and it's worth showing the Mr: 65 + (2 \u00d7 127) = 319.\n\nThink of making cheese sandwiches: 1 cheese slice per sandwich, 0.5 slices but 1 bread... the cheese runs out first, so it limits the sandwiches.", "role": "assistant"}, {"content": "ok thanks , i\u2019ve got it now", "role": "user"}, {"content": "Brilliant, Eesa. You've got the key idea: the limiting reactant runs out first and decides how much product you get, and the one in excess is left over. One small fix to my sandwich example, by the way: I muddled the numbers, so just remember it as \"the ingredient that runs out first limits the sandwiches.\" Next time, always check the mole ratio from the equation before deciding which is limiting. Good session, on to the next topic whenever you're ready.", "role": "assistant"}, {"content": "my feedback for this lesson that u should take note of is that the savemyexams link questions that are shown here are not the right topic that im studying", "role": "user"}, {"content": "Thanks for telling me, Eesa. That's useful feedback. I can't see or change the Save My Exams links the app shows, and I can't pass your note on myself, so it's worth letting the adult with you know. They can report it to whoever runs the app, or you can search Save My Exams yourself for \"Limiting Reactants\" under Edexcel International GCSE Chemistry (4CH1), which is the topic you've just studied.\n\nIn the meantime, you can practise this topic with questions like the zinc and iodine one: write the equation, find the moles of each reactant, use the mole ratio to spot the limiting reactant, then work out the product's mass. If you get stuck on any of them, bring it back here and we'll go through it.", "role": "assistant"}, {"content": "also, if the lesson or topic that im learning doesn't have a video on the freescience lessons channel, then use another channel, like cognito", "role": "user"}, {"content": "Good thinking, Eesa. Cognito is a solid choice for Edexcel International GCSE Chemistry, and it's a sensible backup when a topic isn't on FreeScienceLessons.\n\nOne thing to be upfront about: I can't see or change which videos the app recommends, so I can't make that switch myself. The adult with you can pass the suggestion on to whoever runs the app. In the meantime, you can search YouTube yourself for \"Cognito limiting reactant\" or \"limiting reactants and excess reactants GCSE chemistry\". Just check the video covers moles and mole ratios, since that's what your spec needs.\n\nQuick tip: when you use any video, pause it before the answer appears and try the calculation yourself. That's how it sticks.\n\nAnything else about limiting reactants you want to go over, or shall we wrap up here?", "role": "assistant"}, {"content": "and I don't even think this video and questions covers everything in the topic im meant to be doing", "role": "user"}, {"content": "Fair point, Eesa. I can't see what the app's video and questions cover, so I can't say what's missing, but it's smart to check.\n\nHere's how: ask the adult with you to open the Pearson Edexcel International GCSE Chemistry (4CH1) specification and find the statements on limiting reactants and moles. Use them as a checklist. For each statement, ask yourself, \"Can I do this without help?\" Anything you can't do is a gap.\n\nHere's what a limiting reactant topic usually includes, so you can check it against the spec:\n- explaining what \"limiting reactant\" and \"in excess\" mean\n- using the mole ratio from a balanced equation to find which reactant is limiting\n- calculating the mass of product from the limiting reactant\n- working out how much of the excess reactant is left over\n\nIf the video skips any of these, find another video or past paper questions on that point. Tell the adult too, so the app's maker can hear about it.\n\nWant to try the \"how much excess is left over\" part with your zinc and iodine example?", "role": "assistant"}, {"content": "oh wait never mind, I take the least message back my bad", "role": "user"}, {"content": "No problem at all, Eesa, nothing to apologise for. Checking that a lesson covers your whole spec is a good habit, so keep doing it.\n\nIf the video and questions do cover everything, great. If you ever spot a gap later, you now know how to check it against the 4CH1 spec.\n\nYou've done well today: you can find the limiting reactant using the mole ratio, say which reactant is in excess, and calculate the mass of product with its unit. Whenever you're ready, on to the next topic.", "role": "assistant"}], "day": 1, "done": true, "ended": 1793179453173, "idx": 0, "mins": 68, "proved": true, "reviewed": 1793179758398, "started": 1793175382336, "steps": [true, true, true], "subject": "chemistry", "time": "on", "week": "2026-10-26"}, "2026-10-26_1_1": {"at": "2026-10-28T14:20:01.360Z", "conf": 4, "conv": [{"content": "dw i got it", "role": "user"}, {"content": "Nice one, Eesa. Quick recap so it's locked in for the exam:\n\nTo solve simultaneous equations by the graphical method, you draw both lines accurately on the same axes, then read off the coordinates of the point of intersection. That point is the solution, and the x-value and y-value are your two answers.\n\nThree things that catch people out in exams:\n1. Rearrange to y = mx + c if you need to, or make a table of values, and plot at least 2-3 points per line, using a ruler.\n2. Write the answer as x = ... and y = ..., not just as a coordinate pair, unless the question asks for coordinates.\n3. If the lines are parallel, there is no solution. If they're the same line, there are infinitely many.\n\nYou can also check your answer by substituting it back into both original equations. If both work, you're right.\n\nGood to move on. If you want to try a question later, just say.", "role": "assistant"}], "day": 1, "done": true, "ended": 1793197185271, "idx": 1, "mins": 202, "reviewed": 1793197221881, "started": 1793185070846, "steps": [true, true, true], "subject": "maths", "time": "over", "week": "2026-10-26"}, "2026-10-26_1_2": {"at": "2026-10-28T15:34:59.426Z", "conv": [{"content": "i did this yesterday lol", "role": "user"}, {"content": "Fair enough, Eesa, doing it yesterday is the best time to lock it in. No quiz, just a quick refresher on what matters for the exam.\n\nThe equation is \u0394Q = m \u00d7 c \u00d7 \u0394T. In words: change in thermal energy (joules, J) = mass (kg) \u00d7 specific heat capacity (J/kg\u00b0C) \u00d7 change in temperature (\u00b0C).\n\nSpecific heat capacity is the energy needed to raise the temperature of 1 kg of a substance by 1\u00b0C. That's the definition mark, so learn it word for word.\n\nEveryday example: water has a high specific heat capacity (about 4200 J/kg\u00b0C), so a kettle takes ages to heat up and a pan of water stays warm long after. Metal has a low one, so a spoon heats up fast.\n\nTwo traps examiners love: convert grams to kilograms first, and \u0394T o to get going.\n\nFor Forms of ownership (Edexcel 4BS1), the key things are:\n\n1. Sole trader: one owner, unlimited liability, keeps all profit, easy to set up.\n2. Partnership: two or more owners, usually unlimited liability, shared decisions and profit.\n3. Private limited company (Ltd): shares sold privately, limited liability.\n4. Public limited company (plc): shares sold on the stock exchange, limited liability.\n\nThe big idea is limited liability. It means owners can only lose the money they put in, not their personal things like their house. With unlimited liability, owners are personally responsible for all the business debts, which is the risk.\n\nHere's what to do: tell me which of these you already know a bit about, or just say what you think limited liability means in your own words. Or if you'd rather, ask me anything about the topic and I'll explain it properly.", "role": "assistant"}], "day": 1, "done": true, "ended": 1793209908339, "idx": 4, "mins": 82, "proved": true, "reviewed": 1793209949838, "started": 1793204999713, "steps": [true, true, true], "subject": "business", "time": "over", "week": "2026-10-26"}, "2026-10-26_1_5": {"at": "2026-10-28T17:54:47.657Z", "conf": 4, "conv": [{"content": "i learned this yesterday already", "role": "user"}, {"content": "Fair enough, then we don't need to start from scratch. Quick refresher so it's fresh for the exam: a coordinated response has three parts in order. The stimulus is the change in the environment that gets detected, like a hot pan. The receptor is the cell or organ that detects it, like temperature receptors in your skin. The effector is the muscle or gland that carries out the response, like your arm muscle pulling your hand away.\n\nExam tip: mark schemes like \"stimulus = change in environment\" and \"effector = muscle or gland\". Don't say the brain is the effector, because the brain coordinates but doesn't respond.\n\nSince you already know it, tell me in your own words what you remember, o
